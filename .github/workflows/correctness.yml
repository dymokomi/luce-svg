name: Correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          path: luce-svg
      - id: pins
        run: echo "base=$(cat luce-svg/bootstrap/BASE)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-base
          ref: ${{ steps.pins.outputs.base }}
          path: luce-base
      - name: Select Clang
        run: |
          mkdir -p "$RUNNER_TEMP/luce-bin"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/luce-bin/cc"
          echo "$RUNNER_TEMP/luce-bin" >> "$GITHUB_PATH"
      - run: cd luce-base && ./build.sh
      - run: ./test.sh
        working-directory: luce-svg
